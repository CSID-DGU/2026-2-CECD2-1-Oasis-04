name: ci

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 데이터·모델 없이 도는 부분만 검사한다 (torch 등 무거운 패키지는 설치하지 않음)
      - name: Install test deps
        run: pip install pytest ruff rapidfuzz jamo pyyaml
      - name: Lint
        run: ruff check kb stt scripts tests
      - name: Unit tests
        run: pytest -q tests
