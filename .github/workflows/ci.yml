name: ci

on:
  push:
    branches: [main, develop, "feature/**", "integration/**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 데이터·모델 없이 도는 부분만 검사한다 (torch 등 무거운 패키지는 설치하지 않음)
      - name: Install test deps
        run: pip install pytest ruff rapidfuzz jamo pyyaml
      - name: Lint
        run: ruff check kb stt scripts tests
      - name: Unit tests
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run
      - name: Build (mock)
        run: npm run build
      - name: Build (real)
        run: npm run build:real
