# Senior Voice STT — 단일 설정 파일. 로컬(WSL)과 대여 GPU에서 경로만 바꿔 쓴다.

data:
  root: ~/data/aihub94                 # AI-Hub 데이터 루트 (대여 서버에서는 그곳 경로로)
  manifest_dir: ~/data/aihub94/manifests
  max_seconds: 30                      # Whisper 입력 상한
  min_seconds: 0.3
  split:                               # 화자 해시 버킷(0~9) → 8:1:1
    dev_buckets: [8]
    test_buckets: [9]
  sources:                             # select_utterances.py 출력 TSV + 16 kHz wav 폴더. wav가 없는 행은 건너뜀
    - name: training                   # 키오스크 '지하철' (AI-Hub training)
      index_tsv: subway_training.tsv
      wav16k_dir: subway_16k/training
    - name: validation                 # 키오스크 '지하철' (AI-Hub validation)
      index_tsv: subway_validation.tsv
      wav16k_dir: subway_16k/validation
    - name: robot_training             # AI로봇 버스·정류장·택시·전철 (AI-Hub training)
      index_tsv: bus_training.tsv
      wav16k_dir: bus_16k/training
    - name: robot_validation           # AI로봇 버스·정류장·택시·전철 (AI-Hub validation)
      index_tsv: bus_validation.tsv
      wav16k_dir: bus_16k/validation

models:
  baseline:                            # 기준선(E0) 비교 대상
    - openai/whisper-medium
    - openai/whisper-large-v3-turbo
  finetune_base: openai/whisper-large-v3-turbo
  language: ko
  task: transcribe

lora:                                  # 계획서 표 28 초기값
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, v_proj]

train:
  output_dir: ~/senior-voice/runs/lora-v1
  learning_rate: 1.0e-4
  warmup_ratio: 0.05
  num_epochs: 3
  per_device_batch_size: 4             # 8 GB VRAM 기준. 대여 GPU에서는 16~32로
  grad_accum: 8                        # 실효 배치 32
  fp16: true
  gradient_checkpointing: true
  eval_every_steps: 500
  save_every_steps: 500
  early_stopping_patience: 3
  max_train_samples: 0                 # 0 = 전부. 로컬 점검은 --smoke 옵션(300개)
  max_eval_samples: 0                  # 학습 중 dev 평가 샘플 수 (0 = dev 전부, 생성 평가라 시간이 걸림)
  eval_batch_size: 8
  num_workers: 4                       # DataLoader 워커 (log-mel 계산)
  logging_steps: 10
  seed: 42

rag:                                   # 교통 고유명사 보정 (kb/ + stt/rag_correct.py)
  kb_dir: ~/data/kb_seoul              # kb/build_kb.py --regions 서울 출력 (MVP 는 서울 소재만)
  weights: [0.8, 0.1, 0.1]             # 문자열(자모·발음) 유사도가 지배, 임베딩·거리는 동점일 때 가르는 용도
  geo_radius_m: 20000
  span_min_sim: 0.72                   # 구간 뒤에 교통 단서(까지·행·역·가는 …)가 있을 때 장소로 보는 문자열 유사도 하한
  span_min_sim_nocue: 0.9              # 단서가 없을 때의 하한 (거의 똑같이 들린 이름만. 일반 단어가 장소로 잡히는 것을 막는다)
  substitute_min_sim: 0.75             # 재디코딩이 실패하면 1순위 후보 표기로 직접 치환하는 기준 (순수 자모 유사도 0.7 이상도 함께 요구)
  max_extra_edits: 1                   # 재디코딩 결과가 장소 구간 밖에서 이보다 많이 바뀌면 거부
  skip_if_confidence_above: 1.0        # 1차 신뢰도 기준 생략은 끔. Whisper 는 '선능력'을 0.95 신뢰도로 확신하므로 쓸모없음
  prompt_max_names: 10                 # Whisper 프롬프트에 넣을 후보 이름 수
  kiosks:                              # 키오스크 위치 (서버 kiosk 테이블과 맞출 것). x=경도, y=위도
    KIOSK_JONGNO_01: {name: 종로3가역 키오스크, x: 126.9918, y: 37.5704}
    KIOSK_CHEONGNYANGNI_01: {name: 청량리역 버스정류장 키오스크, x: 127.0458, y: 37.5802}
  location:                            # 화면이 브라우저 위치(GPS)를 보냈을 때 출발지를 정하는 기준 (kb/origin.py)
    snap_m: 150                        # 이 거리 안의 정류장·역은 '그곳에 있다' 고 보고 출발 좌표를 그곳으로 맞춘다
    max_accuracy_m: 1000               # 브라우저가 알려 준 오차 반경이 이보다 크면 위 kiosks 의 고정 위치를 쓴다
    max_distance_m: 2000               # 가장 가까운 정류장·역이 이보다 멀면 안내 범위 밖으로 보고 고정 위치를 쓴다

eval:
  batch_size: 8
  beam_size: 1
  cer_remove_space: true               # 공백 제거 기준 CER (계획서)
  max_eval_samples: 0
