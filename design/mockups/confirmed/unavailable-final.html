<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>UNAVAILABLE 확정 시안 (지하철역: 종로3가)</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/flow.css" />
    <link rel="stylesheet" href="pick.css" />
    <link rel="stylesheet" href="states.css" />
    <script src="../shared/brand.js"></script>
    <style>
      /* UNAVAILABLE 확정본 (2026-11-19, 규칙은 docs/design-guidelines.md 12절). REASKING 과 같은 틀(states.css 의 .stack).
       * 눈이 가는 순서: 1 이유 덩어리(고리 + 문장) → 2 주 버튼 '손으로 고르기' → 3 처음으로. 주 버튼이 먼저 보여도 이유 덩어리가 확실히 두 번째면 된다 (팀장)
       * 문구·버튼은 frontend/src/screens/UnavailableScreen.jsx 그대로다:
       *   제목 "안내해 드릴 수 없어요" / 이유 문구(state.error, errorMessage.js 의 toDisplayMessage) /
       *   오른쪽: 손으로 고르기(주, MANUAL_SELECT_PRESSED) / 처음으로(GO_HOME)
       * 왼쪽 칸: LISTENING 과 같은 자리·크기의 고리. 주 색이 아니라 본문색, 움직임 없음.
       *   가운데 그림은 이유마다 다르다: 경로 없음 깃발, 가까움 걷는 사람, 범위 밖 지도 핀, 길 안내 못 받음·공통 오류 시계(잠시 후).
       *   그림은 기다림 화면의 깃발·말풍선과 같은 세트: 152 칸에 손으로 그린 선, 선 굵기 9.5 (IDLE·LISTENING 아이콘과 같은 굵기)
       * 고리 아래 한 덩어리로: 제목(36px) → 이유 첫 문장(72px 굵게, 오류 색) → 나머지 문장(36px 본문색).
       *   첫 문장만 크게 (1차 결정): 글자는 바꾸지 않고 첫 ". " 뒤에서 나눈다. 오류 색은 첫 문장에만
       *
       * 주소: ?r=<종류> (아래 REASONS), ?left=15 남은 시간 알림 */
    </style>
  </head>
  <body>
    <section class="screen" data-screen="UNAVAILABLE">
      <header class="thin" data-zone="band">
        <div class="thin-brand">
          <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="28" cy="28" r="20" stroke-width="9" />
            <circle cx="28" cy="28" r="5" fill="currentColor" stroke="none" />
          </svg>
          <service-name></service-name>
        </div>
        <div class="thin-place">종로3가</div>
        <div class="thin-now"><span data-date>11월 19일 목요일</span> <span data-clock>오후 2:30</span></div>
        <div class="thin-alert" data-zone="alert" role="status">
          <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z" /></svg>
          <p><b><span data-left>15</span>초 뒤에 처음으로 돌아가요</b><span>계속하시려면 화면을 눌러 주세요</span></p>
        </div>
      </header>

      <div class="body">
        <main class="left">
          <div class="stack" data-zone="content">
            <svg class="ring-big is-text" data-zone="ring" viewBox="-170 -170 340 340" aria-hidden="true">
              <circle class="ring-halo" />
              <circle class="ring-core" />
            </svg>
            <h1 class="stack-title">안내해 드릴 수 없어요</h1>
            <p class="core-line is-error v3-core" data-zone="core" data-reason></p>
            <p class="core-more" data-reason-more></p>
          </div>
        </main>

        <div class="right" data-zone="actions">
          <button type="button" class="btn btn-primary" data-zone="primary">
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M445-80q-29 0-56-12t-45-35L127-403l21-23q14-15 34.5-18.5T221-438l99 53v-365q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v465l-144-77 156 198q10 12 23.76 18 13.76 6 29.24 6h205q38 0 64-26t26-64v-170q0-25.5-17.25-42.75T680-460H460v-60h219.65q50.14 0 85.25 35 35.1 35 35.1 85v170q0 63-43.5 106.5T650-80H445ZM203-665q-11.07-18.75-17.04-40.49-5.96-21.74-5.96-44.76 0-70.75 49.73-120.25Q279.45-920 350-920t120.27 49.74Q520-820.52 520-749.96q0 22.96-5.96 44.62Q508.07-683.68 497-665l-52-30q7-12 11-26t4-29.48Q460-796 427.88-828q-32.12-32-78-32T272-827.92q-32 32.09-32 77.92 0 15 4 29t11 26l-52 30Zm285 335Z" /></svg>
            <span>손으로 고르기</span>
          </button>
          <button type="button" class="btn btn-secondary">
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M220-180h150v-250h220v250h150v-390L480-765 220-570v390Zm-60 60v-480l320-240 320 240v480H530v-250H430v250H160Zm320-353Z" /></svg>
            <span>처음으로</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 가운데 그림 네 가지. 깃발·걷는 사람·지도 핀은 152 칸에 선 굵기 9.5 로 손으로 그렸다 (깃발은 wait-final.html 의 것 그대로).
         시계는 남은 시간 알림과 같은 Material schedule (선 굵기는 152px 에서 9.5 로 같다. 문서 12-3절) -->
    <template id="icon-flag">
      <svg class="ring-icon is-line" viewBox="0 0 152 152"><path d="M46 134V22" /><path d="M46 28h66l-14 24 14 24H46" /></svg>
    </template>
    <template id="icon-walk">
      <svg class="ring-icon is-line" viewBox="0 0 152 152">
        <circle cx="86" cy="26" r="12" />
        <path d="M80 50 70 94" />
        <path d="M78 58 56 74M78 58l20 18 16 4" />
        <path d="M70 94 54 132M70 94l22 16 4 24" />
      </svg>
    </template>
    <template id="icon-pin">
      <svg class="ring-icon is-line" viewBox="0 0 152 152">
        <path d="M76 136C60 116 34 88 34 60a42 42 0 0 1 84 0c0 28-26 56-42 76Z" />
        <circle cx="76" cy="60" r="15" />
      </svg>
    </template>
    <template id="icon-clock">
      <svg class="ring-icon" viewBox="0 -960 960 960"><path d="m627-287 45-45-159-160v-201h-60v225l174 181ZM480-80q-82 0-155-31.5t-127.5-86Q143-252 111.5-325T80-480q0-82 31.5-155t86-127.5Q252-817 325-848.5T480-880q82 0 155 31.5t127.5 86Q817-708 848.5-635T880-480q0 82-31.5 155t-86 127.5Q708-143 635-111.5T480-80Zm0-400Zm0 340q140 0 240-100t100-240q0-140-100-240T480-820q-140 0-240 100T140-480q0 140 100 240t240 100Z" /></svg>
    </template>

    <script>
      // 지금 앱에서 UNAVAILABLE 에 오는 이유 문구 (2026-11-19 코드에서 찾음). 글자는 코드 그대로다 (마침표가 있고 없는 것도 그대로)
      // [문구, 가운데 그림]
      const REASONS = {
        // 기본 5가지 (시안에서 찍는 것)
        noroute: ['가는 길을 찾을 수 없어요', 'flag'], // 경로 없음. effects/handlers/routing.js NO_ROUTE_MESSAGE (서버 ROUTE_NOT_FOUND 도 여기로)
        close: ['가까운 곳이라 걸어서 가실 수 있어요. 약 300미터예요.', 'walk'], // 가까움. server/app.py ROUTE_TOO_CLOSE (거리는 예시)
        scope: ['이 키오스크에서 안내할 수 없는 곳이에요', 'pin'], // 서울 밖 등 범위 밖. effects/handlers/resolving.js OUT_OF_SCOPE_MESSAGE
        upstream: ['지금은 길 안내를 받아올 수 없어요. 잠시 후 다시 해 주세요.', 'clock'], // 카카오 길찾기 실패. stt/api.py EASY.UPSTREAM_ERROR
        generic: ['잠시 문제가 생겼어요. 손으로 고르시거나 처음부터 다시 해 주세요', 'clock'], // 오류 코드·빈 값. screens/errorMessage.js
        // 그 밖에 올 수 있는 것 (stt/api.py EASY 의 쉬운 문장, handlers 의 방어 문구). 찍지 않았다. 그림은 아직 정하지 않아 시계로 둔다
        close0: ['가까운 곳이라 걸어서 가실 수 있어요.', 'walk'], // 출발지와 목적지가 같은 점 (server/kakao.py)
        poi: ['가실 곳을 찾지 못했어요. 처음부터 다시 해 주세요.', 'clock'],
        internal: ['잠시 문제가 생겼어요. 처음 화면으로 돌아갈게요.', 'clock'],
        long: ['말씀이 조금 길었어요. 짧게 한 번 더 말씀해 주세요.', 'clock'],
        audio: ['음성을 처리할 수 없어요. 잠시 후 다시 시도해 주세요.', 'clock'],
        kiosk: ['기기 설정에 문제가 있어요. 직원에게 알려 주세요.', 'clock'],
        model: ['준비 중이에요. 잠시 후 다시 말씀해 주세요.', 'clock'],
        nopoi: ['목적지가 정해지지 않았어요', 'clock'],
        unknown: ['알 수 없는 오류', 'clock'],
      }
      const query = new URLSearchParams(location.search)
      const [message, iconName] = REASONS[query.get('r')] ?? REASONS.noroute
      // 첫 문장만 크게: 첫 ". " 뒤에서 나눈다. 없으면 전체가 첫 문장
      const cut = message.indexOf('. ')
      const [first, rest] = cut < 0 ? [message, ''] : [message.slice(0, cut + 1), message.slice(cut + 2)]
      document.querySelector('[data-reason]').textContent = first
      const more = document.querySelector('[data-reason-more]')
      if (rest) more.textContent = rest
      else more.remove()

      // 가운데 그림: LISTENING 과 같은 --ring-icon(152px)
      const ring = document.querySelector('.ring-big')
      ring.append(document.getElementById(`icon-${iconName}`).content.cloneNode(true).firstElementChild)
      const iconSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ring-icon'))
      ring.querySelectorAll('svg.ring-icon').forEach((icon) => {
        for (const [k, v] of Object.entries({ width: iconSize, height: iconSize, x: -iconSize / 2, y: -iconSize / 2 })) icon.setAttribute(k, v)
      })
    </script>
    <script src="timeout-notice.js"></script>
    <script src="../shared/mock.js"></script>
    <script src="../shared/v3.js"></script>
  </body>
</html>
