<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>LISTENING 확정 시안 (지하철역: 종로3가역)</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/flow.css" />
    <script src="../shared/brand.js"></script>
    <style>
      /* LISTENING 확정본 (2026-11-17). 눈이 가는 순서: 1 듣는 중 표시 → 2 "듣고 있어요" → 3 버튼.
       * 실제 마이크 모드 기준이라 글 입력창이 없다. 화면 제목 "말씀해 주세요"는 "듣고 있어요"와 겹쳐서 보이지 않게 뺐다.
       * 표시와 "듣고 있어요", 안내 두 줄을 한 덩어리로 묶어 왼쪽 칸의 세로 가운데에 둔다. 글은 표시의 가운데 축에 맞춘다.
       * 듣는 중 표시(640px)는 IDLE 주 버튼의 "마이크와 두 겹 고리"를 그대로 꺼내 키운 것이다:
       *   가운데  마이크 + 안쪽 고리(진하게) + 바깥 고리(옅게). IDLE 버튼에서 퍼지던 고리와 같은 두 겹
       *   둘레    막대 40개. 음량에 따라 길이와 진하기가 함께 바뀐다 (조용할 때 파랑 35%, 클 때 100%. 문서 3-5절)
       * 음량은 가짜 값이다 (말소리처럼 오르내린다). 실제 앱에서는 녹음 부품이 음량을 알려 줘야 한다.
       *
       * 배경은 흰색으로 확정 (2026-11-17). 옅은 파랑 안(?bg=blue)은 지웠다.
       * 그 밖에 ?freeze=0.6 은 그 시각(초)의 모습으로 멈춘다 (스크린샷용) */
      :root {
        --meter-size: 640px;
      }
      .listen {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--meter-size);
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
      }
      .meter {
        flex-shrink: 0;
        display: block;
        width: var(--meter-size);
        height: var(--meter-size);
      }
      .meter-bars {
        stroke: var(--color-primary);
        stroke-width: var(--line-width);
        stroke-linecap: round;
      }
      .listen-core {
        margin: 8px 0 0;
        font-size: var(--font-display);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .screen .listen-hint {
        margin: 8px 0 0;
        font-size: var(--font-sub);
        color: var(--color-text);
      }
    </style>
  </head>
  <body>

    <section class="screen" data-screen="LISTENING">
      <header class="thin" data-zone="band">
        <div class="thin-brand">
          <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="28" cy="28" r="20" stroke-width="9" />
            <circle cx="28" cy="28" r="5" fill="currentColor" stroke="none" />
          </svg>
          <service-name></service-name>
        </div>
        <div class="thin-place">종로3가</div>
        <div class="thin-now"><span data-date>11월 17일 화요일</span> <span data-clock>오후 2:30</span></div>
      </header>

      <div class="body">
        <main class="left">
          <div class="listen">
            <div data-zone="content">
              <!-- 듣는 중 표시. 막대는 아래 스크립트가 그린다 -->
              <svg class="meter" data-zone="meter" viewBox="-320 -320 640 640" aria-hidden="true">
                <g class="meter-bars"></g>
                <!-- 고리와 마이크는 기다림 화면과 같은 공통 부품이다 (flow.css 의 .ring-*, 토큰 --halo-r / --ring-r / --ring-icon) -->
                <circle class="ring-halo" />
                <circle class="ring-core" />
                <svg class="ring-icon" viewBox="0 -960 960 960">
                  <path d="M480-423q-43 0-72-30.92-29-30.91-29-75.08v-251q0-41.67 29.44-70.83Q437.88-880 479.94-880t71.56 29.17Q581-821.67 581-780v251q0 44.17-29 75.08Q523-423 480-423Zm0-228Zm-30 531v-136q-106-11-178-89t-72-184h60q0 91 64.29 153t155.5 62q91.21 0 155.71-62Q700-438 700-529h60q0 106-72 184t-178 89v136h-60Zm30-363q18 0 29.5-13.5T521-529v-251q0-17-11.79-28.5T480-820q-17.42 0-29.21 11.5T439-780v251q0 19 11.5 32.5T480-483Z" />
                </svg>
              </svg>
              <h1 class="listen-core v3-core">듣고 있어요</h1>
              <p class="listen-hint">가실 곳을 말씀해 주세요.<br />말씀이 끝나면 자동으로 넘어가요</p>
            </div>
          </div>
        </main>

        <div class="right" data-zone="actions">
          <button type="button" class="btn btn-primary" data-zone="primary">
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M378-246 154-470l43-43 181 181 384-384 43 43-427 427Z" /></svg>
            <span>다 말했어요</span>
          </button>
          <button type="button" class="btn btn-secondary">
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="m249-207-42-42 231-231-231-231 42-42 231 231 231-231 42 42-231 231 231 231-42 42-231-231-231 231Z" /></svg>
            <span>취소</span>
          </button>
          <button type="button" class="btn btn-secondary">
            <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M220-180h150v-250h220v250h150v-390L480-765 220-570v390Zm-60 60v-480l320-240 320 240v480H530v-250H430v250H160Zm320-353Z" /></svg>
            <span>처음으로</span>
          </button>
        </div>
      </div>
    </section>

    <script src="../shared/mock.js"></script>
    <script src="../shared/v3.js"></script>
    <script>
// 고리 가운데 그림의 크기와 자리를 토큰(--ring-icon)에서 읽어 속성으로 넣는다 (flow.css 의 .ring-icon 설명)
      function placeRingIcons() {
        const size = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ring-icon'))
        document.querySelectorAll('svg.ring-icon').forEach((icon) => {
          for (const [k, v] of Object.entries({ width: size, height: size, x: -size / 2, y: -size / 2 })) icon.setAttribute(k, v)
        })
      }
      placeRingIcons()

      // 듣는 중 표시: 막대 40개가 음량에 따라 바깥으로 길어지고 진해진다.
      // 가짜 음량: 말 한 마디(약 2.6초)마다 커졌다 잦아들고, 그 안에서 천천히 출렁인다.
      // 가장 빠른 출렁임이 1초에 약 1.7번이라 깜빡임 한도(1초 3번)보다 느리다. 넓은 면이 번쩍이는 곳은 없다
      const COUNT = 40
      const INNER = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--halo-r')) + 28 // 막대가 시작하는 반지름 (바깥 고리 + 틈)
      const REACH = 130 // 가장 길 때의 길이. 끝의 둥근 머리(7px)까지 더해도 320 을 넘지 않는다
      const FAINT = 0.35 // 조용할 때 파랑이 남는 비율 (문서 3-5절). 클 때는 1
      const group = document.querySelector('.meter-bars')
      const NS = 'http://www.w3.org/2000/svg'
      const bars = Array.from({ length: COUNT }, (_, i) => {
        const line = document.createElementNS(NS, 'line')
        group.append(line)
        return { line, angle: (i / COUNT) * Math.PI * 2 - Math.PI / 2, side: Math.min(i, COUNT - i) } // side: 좌우가 같은 모양이 되게
      })

      const voice = (t) => {
        const phrase = Math.max(0, Math.sin((Math.PI * 2 * t) / 2.6)) ** 0.55 // 한 마디: 커졌다 잦아들고 잠깐 쉰다
        return phrase * (0.8 + 0.2 * Math.sin(Math.PI * 2 * 0.9 * t - 1.8))
      }
      function draw(t) {
        const level = voice(t)
        for (const { line, angle, side } of bars) {
          const wobble = 0.6 + 0.4 * Math.sin(side * 1.9 + t * 5.3) * Math.sin(side * 0.7 - t * 3.1)
          const amount = 0.06 + 0.94 * level * wobble // 0~1. 조용할 때도 점이 조금 길쭉하게 남는다
          const [cos, sin] = [Math.cos(angle), Math.sin(angle)]
          line.setAttribute('x1', (cos * INNER).toFixed(1))
          line.setAttribute('y1', (sin * INNER).toFixed(1))
          line.setAttribute('x2', (cos * (INNER + REACH * amount)).toFixed(1))
          line.setAttribute('y2', (sin * (INNER + REACH * amount)).toFixed(1))
          line.setAttribute('stroke-opacity', (FAINT + (1 - FAINT) * amount).toFixed(2))
        }
      }

      const freeze = new URLSearchParams(location.search).get('freeze')
      // 움직임 줄이기 설정에서는 멈춘 그림 한 장만 보인다. 상태는 "듣고 있어요" 글자가 알린다
      if (freeze !== null || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        draw(freeze !== null ? Number(freeze) : 0.6)
      } else {
        const start = performance.now()
        const loop = (now) => {
          draw((now - start) / 1000)
          requestAnimationFrame(loop)
        }
        requestAnimationFrame(loop)
      }
    </script>
  </body>
</html>
