<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>시연: IDLE → LISTENING → RESOLVING → ROUTING → ROUTE_GUIDE</title>
    <style>
      /* 시연 페이지. 다섯 화면을 순서대로 넘겨 본다.
       *   화면 아무 곳이나 누르면 다음 화면 (마지막 다음은 처음). 키보드: → 또는 스페이스 = 다음, ← = 이전
       *   ROUTE_GUIDE 에서는 경로 카드를 눌러 볼 수 있다. 카드가 아닌 곳을 누르면 다음(처음)으로 넘어간다
       *   전환은 0.25초 나타나기 (문서 3-5절 --motion-screen). 움직임 줄이기 설정에서는 바로 바뀐다
       *   무대는 1920×1080 고정이고 창 크기에 맞춰 통째로 줄인다 (실제 앱의 Stage 와 같은 방식)
       *   ?at=3 은 그 화면부터 시작한다 (0 IDLE, 1 LISTENING, 2 RESOLVING, 3 ROUTING, 4 ROUTE_GUIDE)
       *   확정본(confirmed/)만 쓴다
       * 시안 페이지를 그대로 불러와 겹쳐 놓은 것이라 경로 카드 말고는 화면 안의 버튼이 눌리지 않는다 */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111111;
      }
      .stage {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
        transform: translate(-50%, -50%) scale(var(--scale, 1));
        cursor: pointer;
      }
      .stage iframe {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        border: 0;
        opacity: 0;
        pointer-events: none; /* 누르는 것은 무대가 받는다 */
      }
      .stage iframe.is-on {
        z-index: 1;
        opacity: 1;
        transition: opacity 250ms ease-out;
      }
      /* 바로 앞 화면은 새 화면이 다 나타날 때까지 아래에 그대로 둔다 (사이에 흰 바탕이 비치지 않게) */
      .stage iframe.is-under {
        opacity: 1;
      }
      /* 경로 카드가 있는 화면은 보이는 동안 직접 눌린다. 다음으로 넘기는 것은 그 화면이 알려 준다 (postMessage) */
      .stage iframe.is-on[data-live] {
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        .stage iframe.is-on {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="다음 화면으로">
      <iframe src="../confirmed/idle-final-subway.html" title="IDLE" class="is-on"></iframe>
      <iframe src="../confirmed/listening-final.html" title="LISTENING"></iframe>
      <iframe src="../confirmed/wait-final.html?s=RESOLVING" title="RESOLVING"></iframe>
      <iframe src="../confirmed/wait-final.html?s=ROUTING" title="ROUTING"></iframe>
      <iframe src="../confirmed/route-guide-final.html" title="ROUTE_GUIDE" data-live></iframe>
    </div>

    <script>
      const stage = document.getElementById('stage')
      const frames = [...stage.querySelectorAll('iframe')]
      const query = new URLSearchParams(location.search)

      const fit = () => stage.style.setProperty('--scale', Math.min(innerWidth / 1920, innerHeight / 1080))
      fit()
      addEventListener('resize', fit)

      let index = 0
      function show(next) {
        frames.forEach((f, i) => {
          f.classList.toggle('is-under', i === index && i !== next)
          f.classList.toggle('is-on', i === next)
        })
        index = next
      }
      const start = Number(query.get('at')) || 0
      if (start > 0 && start < frames.length) show(start)

      const step = (by) => show((index + by + frames.length) % frames.length)
      stage.addEventListener('click', () => step(1))
      // ROUTE_GUIDE 화면이 "카드가 아닌 곳을 눌렀다"고 알려 오면 다음으로 넘긴다
      addEventListener('message', (e) => {
        if (e.data?.type === 'demo-next' && e.source === frames[index].contentWindow) step(1)
      })
      addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') step(1)
        if (e.key === 'ArrowLeft') step(-1)
      })
    </script>
  </body>
</html>
