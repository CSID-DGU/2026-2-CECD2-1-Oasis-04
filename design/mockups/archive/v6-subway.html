<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>시안 v6. IDLE 가로 (지하철역: 종로3가역)</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="v6.css" />
  </head>
  <body>
    <!-- (build-v6.mjs 가 만든 파일) 가로 캔버스 1920×1080. 세 파일(v6-subway / v6-bus / v6-default)은 아래 PLACE 값만 다르다 -->
    <!-- 역 번호와 노선색은 공식 자료로 확인하지 않았다 -->
    <script>
      window.PLACE = {
        type: 'SUBWAY_STATION',
        name: '종로3가역',
        lines: [
          { lineId: 'seoul-1', label: '1', stationNo: '130', prev: '종각', next: '종로5가' },
          { lineId: 'seoul-3', label: '3', stationNo: '329', prev: '안국', next: '을지로3가' },
          { lineId: 'seoul-5', label: '5', stationNo: '534', prev: '광화문', next: '을지로4가' },
        ],
      }
    </script>

    <section class="screen" data-screen="IDLE">
      <!-- A. 역명판 띠: 지금 계신 곳 표시를 겸한다. 안쪽은 v6-band.js 가 그린다 -->
      <header class="v6-band">
        <div class="v6-lines"></div>
        <div class="v6-brand">
          <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="28" cy="28" r="20" stroke-width="9" />
            <circle cx="28" cy="28" r="5" fill="currentColor" stroke="none" />
          </svg>
          <span>말길</span>
        </div>
        <div class="v6-note"></div>
        <div class="v6-now"><span data-date>11월 16일 월요일</span> <span data-clock>오후 2:30</span></div>
        <div class="v6-plate"></div>
      </header>

      <!-- C. 왼쪽 내용 칸: 질문과 예시. 주 버튼과 세로 가운데를 맞춘다 -->
      <main class="v6-content">
        <h1 class="v6-question v3-core">어디로 가시나요?</h1>
        <div class="v6-say">
          <span class="v6-say-label">이렇게 말해 보세요</span>
          <span class="v6-say-words" data-rotate="명동 어떻게 가요?|서울역 가는 버스|가까운 병원|동대문시장 가는 길"></span>
        </div>
      </main>

      <!-- B. 오른쪽 행동 판 -->
      <div class="v6-rail">
        <button type="button" class="btn btn-primary">
          <span class="v6-mic"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-423q-43 0-72-30.92-29-30.91-29-75.08v-251q0-41.67 29.44-70.83Q437.88-880 479.94-880t71.56 29.17Q581-821.67 581-780v251q0 44.17-29 75.08Q523-423 480-423Zm0-228Zm-30 531v-136q-106-11-178-89t-72-184h60q0 91 64.29 153t155.5 62q91.21 0 155.71-62Q700-438 700-529h60q0 106-72 184t-178 89v136h-60Zm30-363q18 0 29.5-13.5T521-529v-251q0-17-11.79-28.5T480-820q-17.42 0-29.21 11.5T439-780v251q0 19 11.5 32.5T480-483Z"/></svg></span>
          <span>말하기</span>
        </button>
        <button type="button" class="btn btn-secondary">손으로 고르기</button>
      </div>
    </section>

    <script src="../shared/mock.js"></script>
    <script src="../shared/v3.js"></script>
    <script src="v6-band.js"></script>
  </body>
</html>
