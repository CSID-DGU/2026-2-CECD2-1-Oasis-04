<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>시안 v4. IDLE (장소 정보 없음: 기본 그림)</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="v4.css" />
  </head>
  <body>
    <!-- 세 파일(v4-subway / v4-bus / v4-default)은 아래 PLACE 값만 다르다. 화면 구조와 스타일은 완전히 같다 -->
    <!-- 장소 정보가 없거나 불러오지 못했을 때의 모습 -->
    <script>
      window.PLACE = null
    </script>

    <section class="screen" data-screen="IDLE">
      <div class="v4-abs v4-head">
        <div class="v4-brand">
          <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="28" cy="28" r="20" stroke-width="9" />
            <circle cx="28" cy="28" r="5" fill="currentColor" stroke="none" />
          </svg>
          <span>말길</span>
        </div>
        <div><span data-date>11월 16일 월요일</span> <span data-clock>오후 2:30</span></div>
      </div>

      <div class="v4-abs v4-place"></div>
      <div class="v4-abs v4-diagram"></div>

      <div class="v4-abs v4-bottom">
        <div class="v4-say">
          <div class="v4-say-label">이렇게 말해 보세요</div>
          <div class="v4-say-words" data-rotate="명동 어떻게 가요?|서울역 가는 버스|가까운 병원|동대문시장 가는 길"></div>
        </div>
        <h1 class="v4-question v3-core">어디로 가시나요?</h1>
        <button type="button" class="btn btn-primary"><svg class="v4-ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-423q-43 0-72-30.92-29-30.91-29-75.08v-251q0-41.67 29.44-70.83Q437.88-880 479.94-880t71.56 29.17Q581-821.67 581-780v251q0 44.17-29 75.08Q523-423 480-423Zm0-228Zm-30 531v-136q-106-11-178-89t-72-184h60q0 91 64.29 153t155.5 62q91.21 0 155.71-62Q700-438 700-529h60q0 106-72 184t-178 89v136h-60Zm30-363q18 0 29.5-13.5T521-529v-251q0-17-11.79-28.5T480-820q-17.42 0-29.21 11.5T439-780v251q0 19 11.5 32.5T480-483Z"/></svg>말하기</button>
        <button type="button" class="btn btn-secondary">손으로 고르기</button>
      </div>
    </section>

    <script src="../shared/mock.js"></script>
    <script src="../shared/v3.js"></script>
    <script src="v4-diagram.js"></script>
  </body>
</html>
