<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>띠 비교: v8 / v9 / 확정판(v10)</title>
    <style>
      /* 비교용 도구 페이지 (키오스크 화면이 아님). 띠 부분만 잘라서 보여 준다 */
      @import url('../../../frontend/src/styles/global.css');
      html,
      body {
        width: auto;
        height: auto;
      }
      body {
        padding: 20px;
        font-size: 17px;
        background: #dddddd;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      .row {
        display: grid;
        grid-template-columns: 130px repeat(3, 640px);
        gap: 12px;
        margin-bottom: 12px;
        font-weight: 700;
      }
      .crop {
        width: 640px;
        height: 113px;
        overflow: hidden;
        border: 1px solid var(--color-text-sub);
      }
      .crop img {
        display: block;
        width: 640px;
      }
    </style>
  </head>
  <body>
    <h1>띠 비교 (위쪽 띠만 잘라 33%로 줄여 봄). v8 그대로 / v9 / 확정판 v10 (v8 모양 + v9 의 규칙)</h1>
    <div class="row"><div></div><div>v8</div><div>v9</div><div>v10 (이번 것)</div></div>
    <div id="rows"></div>
    <script>
      const CASES = [
        ['jongno3ga', '기준: 종로3가'],
        ['anguk', '노선 1개'],
        ['chungmuro', '노선 2개'],
        ['seoul', '노선 5개, 종점'],
        ['ogeum', '종점'],
        ['bus', '기준: 종로3가.탑골공원'],
        ['busmany', '버스 6종류'],
        ['buslong', '긴 이름 + 버스'],
        ['buscircular', '순환버스'],
      ]
      const crop = (v, c) => `<a class="crop" href="${v}-test.html?case=${c}"><img src="shots/${v}-test-${c}.png" alt="${v} ${c}" /></a>`
      document.getElementById('rows').innerHTML = CASES.map(([c, name]) => `<div class="row"><div>${name}</div>${crop('v8', c)}${crop('v9', c)}${crop('v10', c)}</div>`).join('')
    </script>
  </body>
</html>
