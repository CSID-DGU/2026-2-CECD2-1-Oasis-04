<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>시안 v3-1. 노선도 스타일 (IDLE)</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <style>
      /* v3-1 노선도 스타일. 종로3가역을 지나는 세 노선(1·3·5호선)의 색이 화면의 색이다.
       * 글자는 모두 흰 바탕 위 검정·회색이다. 노선색 위에는 글자를 올리지 않는다 (문서 3-6절) */
      :root {
        /* 노선색: 공식 자료로 확인하지 않은 임시값 (문서 3-6절, 확인 필요) */
        --line-seoul-1: #0052a4;
        --line-seoul-3: #ef7c1c;
        --line-seoul-5: #996cac;
        /* 시안 전용 */
        --font-question: 150px; /* 문서의 120px(숫자 전용)보다 크다. 채택하면 문서 3-3절부터 고친다 */
        --font-display: 72px;
        --pad: 48px;
        --badge: 92px;
        --line-badge: 64px;
        --btn-tall: 200px;
      }

      .screen {
        padding: 0;
      }

      .map {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .abs {
        position: absolute;
        margin: 0;
        white-space: nowrap;
      }

      /* 위: 시각과 날짜, 서비스 이름 */
      .now {
        top: var(--pad);
        left: var(--pad);
      }
      .now-time {
        font-size: var(--font-display);
        font-weight: 700;
        line-height: 1.1;
      }
      .brand {
        top: var(--pad);
        right: var(--pad);
        display: flex;
        align-items: center;
        gap: 16px;
        font-weight: 700;
      }
      .brand svg {
        width: 56px;
        height: 56px;
      }

      /* 역 번호 원 안의 숫자, 노선 번호 */
      .num {
        display: flex;
        align-items: center;
        justify-content: center;
        width: var(--badge);
        height: var(--badge);
        font-size: 32px;
        font-weight: 700;
        transform: translate(-50%, -50%);
      }
      .num.is-line {
        width: var(--line-badge);
        height: var(--line-badge);
        font-size: var(--font-sub);
      }

      .station {
        top: 232px;
        left: 736px;
      }
      .station-name {
        font-size: var(--font-display);
        font-weight: 700;
        line-height: 1.15;
      }
      .near {
        font-size: var(--font-sub);
        color: var(--color-text-sub);
      }

      /* 지금 계신 곳: 검은 표 (흰 글씨 + #111111, 문서 3-2절) */
      .here {
        top: 912px;
        left: var(--pad);
        padding: 12px 28px;
        font-size: var(--font-sub);
        background: var(--color-bg);
        border: 5px solid var(--color-text);
        border-radius: var(--radius);
      }
      .here strong {
        margin-left: 0.5em;
      }

      .question {
        top: 1010px;
        left: var(--pad);
        font-size: var(--font-question);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.02em;
      }

      /* 예시 문구: 3호선 색 세로 막대 옆에 */
      .say {
        top: 1400px;
        left: var(--pad);
        width: 860px;
        padding: 22px 36px 26px;
        color: var(--color-on-primary);
        background: var(--color-text);
        border-radius: var(--radius);
      }
      .say-label {
        font-size: var(--font-sub);
      }
      .say-words {
        font-size: var(--font-display);
        font-weight: 700;
        line-height: 1.2;
      }

      /* 버튼 두 개를 같은 크기로 나란히 */
      .actions {
        position: absolute;
        left: var(--pad);
        right: var(--pad);
        bottom: var(--pad);
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--btn-gap);
      }
      .screen .actions .btn {
        min-width: 0;
        min-height: var(--btn-tall);
      }
      .screen .actions .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      .ico {
        width: 72px;
        height: 72px;
        fill: currentColor;
      }
      .screen .actions .btn-primary {
        box-shadow: 0 8px 0 var(--color-primary-pressed);
      }
      .screen .actions .btn-secondary {
        box-shadow: 0 8px 0 var(--color-text);
      }
    </style>
  </head>
  <body>
    <section class="screen" data-screen="IDLE">
      <!-- 노선도. 띠 굵기 60. 좌표는 1080×1920 그대로 -->
      <svg class="map" viewBox="0 0 1080 1920" fill="none" aria-hidden="true">
        <g stroke-width="60" stroke-linejoin="round">
          <path d="M-40 300H300L430 430H1120" stroke="var(--line-seoul-3)" />
          <path d="M-40 560H1120" stroke="var(--line-seoul-1)" />
          <path d="M-40 690H760L880 810H930L990 870V1490L1120 1620" stroke="var(--line-seoul-5)" />
        </g>
        <!-- 옆 역: 띠 위의 흰 점 -->
        <g fill="#fff">
          <circle cx="150" cy="300" r="15" />
          <circle cx="900" cy="430" r="15" />
          <circle cx="150" cy="560" r="15" />
          <circle cx="900" cy="560" r="15" />
          <circle cx="150" cy="690" r="15" />
          <circle cx="990" cy="960" r="15" />
          <circle cx="990" cy="1150" r="15" />
          <circle cx="990" cy="1340" r="15" />
        </g>
        <!-- 갈아타는 역: 세 노선을 잇는 흰 통 + 역 번호 원 -->
        <rect x="574" y="364" width="132" height="392" rx="66" fill="#fff" stroke="#111" stroke-width="10" />
        <circle cx="640" cy="430" r="44" fill="#fff" stroke="var(--line-seoul-3)" stroke-width="10" />
        <circle cx="640" cy="560" r="44" fill="#fff" stroke="var(--line-seoul-1)" stroke-width="10" />
        <circle cx="640" cy="690" r="44" fill="#fff" stroke="var(--line-seoul-5)" stroke-width="10" />
        <!-- 역에서 지금 계신 곳까지 걷는 길 -->
        <path d="M640 764V852H200V908" stroke="#111" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 22" />
        <!-- 노선 번호 원 (왼쪽 끝) -->
        <circle cx="60" cy="300" r="34" fill="#fff" stroke="var(--line-seoul-3)" stroke-width="8" />
        <circle cx="60" cy="560" r="34" fill="#fff" stroke="var(--line-seoul-1)" stroke-width="8" />
        <circle cx="60" cy="690" r="34" fill="#fff" stroke="var(--line-seoul-5)" stroke-width="8" />
      </svg>

      <div class="abs now">
        <div class="now-time" data-clock>오후 2:30</div>
        <div data-date>11월 16일 월요일</div>
      </div>
      <div class="abs brand">
        <svg viewBox="0 0 56 56" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="28" cy="28" r="20" stroke-width="9" />
          <circle cx="28" cy="28" r="5" fill="currentColor" stroke="none" />
        </svg>
        <span>말길</span>
      </div>

      <!-- 역 번호와 노선 번호 -->
      <div class="abs num" style="left: 640px; top: 430px">329</div>
      <div class="abs num" style="left: 640px; top: 560px">130</div>
      <div class="abs num" style="left: 640px; top: 690px">534</div>
      <div class="abs num is-line" style="left: 60px; top: 300px">3</div>
      <div class="abs num is-line" style="left: 60px; top: 560px">1</div>
      <div class="abs num is-line" style="left: 60px; top: 690px">5</div>

      <div class="abs station">
        <div class="near">가까운 역</div>
        <div class="station-name">종로3가</div>
      </div>

      <!-- 옆 역 이름 -->
      <div class="abs near" style="left: 120px; top: 342px">안국</div>
      <div class="abs near" style="left: 830px; top: 470px">을지로3가</div>
      <div class="abs near" style="left: 120px; top: 598px">종각</div>
      <div class="abs near" style="left: 850px; top: 598px">종로5가</div>
      <div class="abs near" style="left: 104px; top: 730px">광화문</div>
      <div class="abs near" style="right: 134px; top: 939px">을지로4가</div>
      <div class="abs near" style="right: 134px; top: 1129px">동대문역사문화공원</div>
      <div class="abs near" style="right: 134px; top: 1319px">청구</div>

      <div class="abs here">지금 계신 곳<strong>종로3가.탑골공원 정류장</strong></div>

      <h1 class="abs question v3-core">어디로<br />가시나요?</h1>

      <div class="abs say">
        <div class="say-label">이렇게 말해 보세요</div>
        <div class="say-words" data-rotate="명동 어떻게 가요?|서울역 가는 버스|가까운 병원|동대문시장 가는 길"></div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-423q-43 0-72-30.92-29-30.91-29-75.08v-251q0-41.67 29.44-70.83Q437.88-880 479.94-880t71.56 29.17Q581-821.67 581-780v251q0 44.17-29 75.08Q523-423 480-423Zm0-228Zm-30 531v-136q-106-11-178-89t-72-184h60q0 91 64.29 153t155.5 62q91.21 0 155.71-62Q700-438 700-529h60q0 106-72 184t-178 89v136h-60Zm30-363q18 0 29.5-13.5T521-529v-251q0-17-11.79-28.5T480-820q-17.42 0-29.21 11.5T439-780v251q0 19 11.5 32.5T480-483Z"/></svg>말하기</button>
        <button type="button" class="btn btn-secondary"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M445-80q-29 0-56-12t-45-35L127-403l21-23q14-15 34.5-18.5T221-438l99 53v-365q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v465l-144-77 156 198q10 12 23.76 18 13.76 6 29.24 6h205q38 0 64-26t26-64v-170q0-25.5-17.25-42.75T680-460H460v-60h219.65q50.14 0 85.25 35 35.1 35 35.1 85v170q0 63-43.5 106.5T650-80H445ZM203-665q-11.07-18.75-17.04-40.49-5.96-21.74-5.96-44.76 0-70.75 49.73-120.25Q279.45-920 350-920t120.27 49.74Q520-820.52 520-749.96q0 22.96-5.96 44.62Q508.07-683.68 497-665l-52-30q7-12 11-26t4-29.48Q460-796 427.88-828q-32.12-32-78-32T272-827.92q-32 32.09-32 77.92 0 15 4 29t11 26l-52 30Zm285 335Z"/></svg>손으로 고르기</button>
      </div>
    </section>

    <script src="../shared/mock.js"></script>
    <script src="../shared/v3.js"></script>
  </body>
</html>
