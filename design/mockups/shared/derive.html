<!doctype html>
<!-- 스크린샷 한 장을 흑백이나 축소본으로 바꿔 다시 찍기 위한 도구 페이지 (shoot.sh 가 쓴다).
     주소: derive.html?src=shots/a-IDLE.png&w=270&h=480&gray=1&blur=12 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>스크린샷 변환</title>
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      img {
        display: block;
      }
    </style>
  </head>
  <body>
    <img id="shot" alt="" />
    <script>
      const p = new URLSearchParams(location.search)
      const img = document.getElementById('shot')
      img.width = Number(p.get('w'))
      img.height = Number(p.get('h'))
      // gray=1 흑백, blur=12 흐림(px). 흐림은 가장자리가 비치지 않게 그림을 살짝 키워 자른다
      const filters = []
      if (p.get('gray') === '1') filters.push('grayscale(1)')
      if (p.get('blur')) filters.push('blur(' + Number(p.get('blur')) + 'px)')
      img.style.filter = filters.join(' ')
      img.src = p.get('src')
    </script>
  </body>
</html>
